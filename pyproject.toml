[project]
name = "regumoa"
version = "0.1.0"
description = "Assistant de questions-réponses sur la réglementation bancaire BCEAO/UMOA"
authors = [
    {name = "Namory Fofana"}
]
requires-python = ">=3.12"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "regumoa", from = "src" }]
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.17.0,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)"
]
