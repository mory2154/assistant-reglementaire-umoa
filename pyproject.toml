[project]
name = "regumoa"
version = "0.1.0"
description = "Assistant de questions-réponses sur la réglementation bancaire BCEAO/UMOA"
authors = [
    {name = "Namory Fofana"}
]
requires-python = ">=3.12"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "regumoa", from = "src" }]
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.17.0,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # style de base (pycodestyle)
    "F",       # erreurs réelles : imports inutilisés, noms non définis
    "I",       # tri des imports
    "B",       # pièges classiques (bugbear)
    "UP",      # syntaxe Python moderne
    "SIM",     # simplifications possibles
    "S",       # sécurité (bandit)
    "RUF",     # règles propres à ruff
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert est normal dans les tests

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
